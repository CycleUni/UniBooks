name: unibooks

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
      # The README's override: a .env beside this file, if present, wins.
      # A root .env alone only fills ${VAR} placeholders in this file, so
      # values put there never reached the containers.
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-unibooks}
    ports:
      # Loopback only. Published as "5432:5432" this listened on every
      # interface, so the dev database — password `unibooks`, seeded with
      # whatever you have been testing with — was reachable by anyone sharing
      # the network with the laptop. psql from the host still works.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unibooks} -d ${POSTGRES_DATABASE:-unibooks}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Loopback only, as with Postgres above — and this one takes no password
      # at all, so an open port is an open shell into the cache (and the JWT
      # whitelist that lives in it).
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env.docker
      # The README's override: a .env beside this file, if present, wins.
      # A root .env alone only fills ${VAR} placeholders in this file, so
      # values put there never reached the containers.
      - path: .env
        required: false
    environment:
      DJANGO_READ_DOT_ENV_FILE: "0"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      POSTGRES_HOST: db
      POSTGRES_SSLMODE: "disable"
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      EDGE_CHAT_URL: ${EDGE_CHAT_URL:-http://localhost:8787}
      EDGE_CHAT_APP_ID: ${EDGE_CHAT_APP_ID:-unibooks}
      DEFAULT_SUPERUSER_FIRST_NAME: ${DEFAULT_SUPERUSER_FIRST_NAME:-Admin}
      ISBNNET_RESOLVER_URL: ${ISBNNET_RESOLVER_URL:-http://isbnnet-resolver:8789}
    ports:
      # Loopback only, like the database: the backend runs with DEBUG=True and
      # the template's well-known dev secrets.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./UniBooks-BE:/app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      isbnnet-resolver:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    env_file:
      - .env.docker
      # The README's override: a .env beside this file, if present, wins.
      # A root .env alone only fills ${VAR} placeholders in this file, so
      # values put there never reached the containers.
      - path: .env
        required: false
    environment:
      NG_APP_BACKEND_URL: ${NG_APP_BACKEND_URL:-http://localhost:8000/api/v1}
      NG_APP_ALLOWED_HOSTS: ${NG_APP_ALLOWED_HOSTS:-localhost,127.0.0.1,frontend}
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ./UniBooks-FE/src:/app/src
      - ./UniBooks-FE/scripts:/app/scripts
      - ./UniBooks-FE/public:/app/public
      - ./UniBooks-FE/angular.json:/app/angular.json
      - ./UniBooks-FE/package.json:/app/package.json
      - ./UniBooks-FE/tsconfig.json:/app/tsconfig.json
      - ./UniBooks-FE/tsconfig.app.json:/app/tsconfig.app.json
      - ./UniBooks-FE/nodemon.json:/app/nodemon.json
      - ./UniBooks-FE/functions:/app/functions
      - ./UniBooks-FE/wrangler.toml:/app/wrangler.toml
      - ./UniBooks-FE/proxy.conf.json:/app/proxy.conf.json
    working_dir: /app
    depends_on:
      - backend

  isbnnet-resolver:
    build:
      context: .
      dockerfile: docker/Dockerfile.isbnnet-resolver
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      - "./ISBN Search Proxy/ISBNnet Resolver/src:/app/src"
      - "./ISBN Search Proxy/ISBNnet Resolver/wrangler.toml:/app/wrangler.toml"
      - "./ISBN Search Proxy/ISBNnet Resolver/tsconfig.json:/app/tsconfig.json"
      - "./ISBN Search Proxy/ISBNnet Resolver/package.json:/app/package.json"

  cfedgechat:
    build:
      context: .
      dockerfile: docker/Dockerfile.cfedgechat
    env_file:
      - .env.docker
      # The README's override: a .env beside this file, if present, wins.
      # A root .env alone only fills ${VAR} placeholders in this file, so
      # values put there never reached the containers.
      - path: .env
        required: false
    environment:
      DJANGO_WEBHOOK_URL: ${DJANGO_WEBHOOK_URL:-http://backend:8000/api/v1/messaging/webhook/edge-chat/}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./CFEdgeChat/src:/app/src
      - ./CFEdgeChat/wrangler.toml:/app/wrangler.toml
      - ./CFEdgeChat/package.json:/app/package.json
      - ./CFEdgeChat/tsconfig.json:/app/tsconfig.json
    working_dir: /app
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: